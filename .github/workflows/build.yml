
name: CMake Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.0.x'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libasound2-dev \
            libfreetype-dev \
            libfontconfig1-dev

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -B build -S . -A x64

      - name: Build
        run: cmake --build build --config Debug --parallel
